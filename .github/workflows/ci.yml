name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck / test / cargo test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          # Windows runs on every PR because the encrypted local store once
          # crashed only there (SQLCipher cipher_memory_security recursion,
          # issue #8), first caught at release-tag time. macOS stays
          # release-only.
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test -- --test-threads=1

  # Secret scan: the whole git history, with gitleaks, against a reviewed
  # baseline (.gitleaks-baseline.json; every entry reviewed 2026-10-02 and
  # found not to be a secret, values redacted). Any NEW finding fails this
  # job.
  # What to do on a finding: fbc-peak docs/operations/secret-scanning.md.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks against the reviewed baseline
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner \
            --baseline-path /repo/.gitleaks-baseline.json
