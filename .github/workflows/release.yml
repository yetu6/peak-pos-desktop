# Build Yetu POS Desktop installers and publish GitHub Releases with SHA256SUMS.
# Also syncs signed updater metadata to the VPS download host.
#
# Triggers:
#   - tag v* (e.g. v0.1.0) → create a GitHub Release
#   - workflow_dispatch → build artifacts without requiring a tag

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release from this run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux bundling deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Typecheck + unit tests
        run: |
          bun run typecheck
          bun run test

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri bundle (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required for release builds"
            exit 1
          fi
          bunx tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          if [ "${{ matrix.platform }}" = "linux" ]; then
            find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.sig' \) -exec cp -a {} dist/release/ \;
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.nsis.zip' -o -name '*.sig' \) -exec cp -a {} dist/release/ \;
          else
            find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp -a {} dist/release/ \;
          fi
          ls -la dist/release
          test "$(find dist/release -type f | wc -l)" -gt 0

      - name: Checksums
        shell: bash
        run: scripts/checksum-release.sh dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: yetu-pos-${{ matrix.platform }}
          path: dist/release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp -a {} release/ \;
          cd release
          find . -type f ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.asc' ! -name 'latest.json' \
            | sed 's|^\./||' | LC_ALL=C sort \
            | while IFS= read -r file; do sha256sum -- "$file"; done > SHA256SUMS
          VERSION="$TAG_NAME"
          PUBLIC_BASE="https://downloads.yetu.fbcsoftwares.com/pos/${VERSION#v}"
          ../scripts/build-updater-manifest.sh "$VERSION" "$PUBLIC_BASE" . > latest.json
          cat SHA256SUMS
          cat latest.json
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Yetu POS ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          draft: ${{ github.ref_type != 'tag' }}
          files: release/*
          body: |
            Yetu POS Desktop installers (checksummed + signed updater channel).

            Verify with `SHA256SUMS` before installing.

            Hospitality Web links hotels via `NEXT_PUBLIC_POS_DOWNLOAD_URL`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-downloads:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    runs-on: ubuntu-22.04
    environment: production
    concurrency:
      group: production-pos-downloads
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage + build updater manifest
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          mkdir -p stage
          find artifacts -type f -exec cp -a {} stage/ \;
          VERSION="$TAG_NAME"
          PUBLIC_BASE="https://downloads.yetu.fbcsoftwares.com/pos/${VERSION#v}"
          scripts/build-updater-manifest.sh "$VERSION" "$PUBLIC_BASE" stage > stage/latest.json
          (
            cd stage
            find . -type f ! -name 'SHA256SUMS' ! -name 'latest.json' \
              | sed 's|^\./||' | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum -- "$file"; done > SHA256SUMS
          )

      - name: SSH publish to peak-prod downloads
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ] || [ -z "$PRODUCTION_HOST" ] || [ -z "$PRODUCTION_USER" ]; then
            echo "::error::production SSH secrets are missing"
            exit 1
          fi
          PRODUCTION_HOST=$(printf '%s' "$PRODUCTION_HOST" | tr -d '\r\n[:space:]')
          PRODUCTION_USER=$(printf '%s' "$PRODUCTION_USER" | tr -d '\r\n[:space:]')
          python3 scripts/ci-write-ssh-key.py
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          REMOTE_STAGE=/tmp/yetu-pos-release-stage-$$
          ssh -o IdentitiesOnly=yes -o BatchMode=yes \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -o IdentitiesOnly=yes -o BatchMode=yes -r stage/* \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}:${REMOTE_STAGE}/"
          ssh -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "PEAK_POS_VERSION=$TAG_NAME PEAK_POS_STAGE_DIR=$REMOTE_STAGE sh -s" \
            < scripts/publish-downloads.sh
          ssh -o IdentitiesOnly=yes -o BatchMode=yes \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "rm -rf '$REMOTE_STAGE'"
