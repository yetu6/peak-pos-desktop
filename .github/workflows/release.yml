# Build signed Yetu POS Desktop installers, publish a GitHub Release, and sync
# the VPS download + updater channel (https://downloads.yetu.fbcsoftwares.com/pos/).
#
# Triggers:
#   - tag v* (e.g. v0.1.0)
#   - workflow_dispatch (optional create_release)

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release from this run"
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.11"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          chmod +x scripts/verify-release-version.sh
          scripts/verify-release-version.sh "${{ github.ref_name }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux bundling deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # rusqlite's bundled-sqlcipher-vendored-openssl feature (Cargo.toml)
      # compiles OpenSSL from source via openssl-src, which needs a real
      # Perl to run its Configure script. windows-latest carries two: Git
      # for Windows' own bundled MSYS/UnxUtils Perl (paths under
      # /usr/share/perl5, missing working core modules like Params::Check)
      # and the runner's native Strawberry Perl -- and whichever Git's own
      # bin directory puts first in the default PATH wins `perl`, which was
      # the Git one here ("BEGIN failed--compilation aborted at
      # /usr/share/perl5/core_perl/Params/Check.pm"). Prepending Strawberry
      # Perl's own bin directory makes it win instead, without needing to
      # know where in PATH the wrong one sits.
      - name: Confirm Strawberry Perl is present
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $strawberry = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $strawberry)) {
            Write-Error "Strawberry Perl not found at $strawberry -- runner image layout changed"
            exit 1
          }
          & $strawberry -v

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Typecheck + unit tests
        run: |
          bun run typecheck
          bun run test

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test -- --test-threads=1

      - name: Build Tauri bundle (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Named setting: the Yetu API a released till talks to, baked into the
          # build (packagedApiUrl, src/lib/peakConfig.ts), so a new till opens on
          # pairing and never asks for a server address. The repository variable
          # YETU_API_URL replaces the default for another environment. Set here,
          # not in .env.production, which would override a developer's own
          # .env.local in every local production build.
          VITE_PEAK_API_URL: ${{ vars.YETU_API_URL || 'https://api.yetu.fbcsoftwares.com' }}
          # openssl-sys (via rusqlite's bundled-sqlcipher-vendored-openssl,
          # Cargo.toml) compiles OpenSSL from source and needs a real Perl
          # to run its Configure script. Prepending Strawberry Perl's own
          # directory to PATH (an earlier attempt at this same fix) did not
          # survive into this step: this step's own `shell: bash` starts a
          # fresh Git-for-Windows bash, which reconstructs PATH from its own
          # MSYS profile and puts its bundled Perl (missing working core
          # CPAN modules -- "BEGIN failed--compilation aborted at
          # /usr/share/perl5/core_perl/Params/Check.pm") ahead of anything
          # added to the outer Windows PATH beforehand. openssl-src's own
          # build script reads the PERL env var before ever searching PATH
          # (see openssl-src's lib.rs), which a child process's environment
          # carries through a shell change that a PATH edit does not, so
          # this is the one override guaranteed to reach it regardless of
          # which shell invoked cargo.
          PERL: ${{ matrix.platform == 'windows' && 'C:\Strawberry\perl\bin\perl.exe' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # The PERL expression above yields an empty string off Windows, and
          # openssl-src trusts PERL whenever it is set: macOS ran `"" ./Configure`
          # and failed (run 38187441201) once the Rust cache no longer skipped
          # the OpenSSL build script. Only Windows needs the override.
          if [ -z "${PERL:-}" ]; then unset PERL; fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required for release builds"
            exit 1
          fi
          bunx tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/collect-release-artifacts.sh
          scripts/collect-release-artifacts.sh \
            "${{ matrix.platform }}" \
            src-tauri/target/release/bundle \
            dist/collected

      - uses: actions/upload-artifact@v4
        with:
          name: yetu-pos-${{ matrix.platform }}
          path: dist/collected/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    runs-on: ubuntu-22.04
    environment: production
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release + updater manifest
        id: meta
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-build.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release
          scripts/flatten-release-artifacts.sh artifacts release
          PUBLIC_BASE="https://downloads.yetu.fbcsoftwares.com/pos/${VERSION}"
          # Layout for manifest: re-create platform dirs from flattened names by
          # re-scanning collected trees (authoritative) instead of flat guesswork.
          mkdir -p manifest-src
          for cell in artifacts/yetu-pos-*; do
            [ -d "$cell" ] || continue
            for key in linux-x86_64 windows-x86_64 darwin-aarch64 darwin-x86_64; do
              if [ -d "$cell/$key" ]; then
                mkdir -p "manifest-src/$key"
                cp -a "$cell/$key/." "manifest-src/$key/"
              fi
            done
          done
          scripts/build-updater-manifest.sh "$VERSION" "$PUBLIC_BASE" manifest-src > release/latest.json
          (
            cd release
            find . -type f ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.asc' \
              | sed 's|^\./||' | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum -- "$file"; done > SHA256SUMS
          )
          echo "==== SHA256SUMS ===="
          cat release/SHA256SUMS
          echo "==== latest.json ===="
          cat release/latest.json
          python3 -c 'import json; d=json.load(open("release/latest.json")); assert d["platforms"]["linux-x86_64"]["signature"]; assert d["platforms"]["windows-x86_64"]["signature"]; assert any(k.startswith("darwin-") for k in d["platforms"]); print("manifest platforms:", sorted(d["platforms"]))'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-build.{0}', github.run_number) }}
          name: Yetu POS ${{ steps.meta.outputs.version }}
          draft: ${{ github.ref_type != 'tag' }}
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Yetu POS Desktop ${{ steps.meta.outputs.version }}

            - Checksums: `SHA256SUMS`
            - Updater channel: `https://downloads.yetu.fbcsoftwares.com/pos/stable/latest.json`
            - Installers: `https://downloads.yetu.fbcsoftwares.com/pos/latest/`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-downloads:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    runs-on: ubuntu-22.04
    environment: production
    concurrency:
      group: production-pos-downloads
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage for VPS
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          mkdir -p stage manifest-src
          scripts/flatten-release-artifacts.sh artifacts stage
          for cell in artifacts/yetu-pos-*; do
            [ -d "$cell" ] || continue
            for key in linux-x86_64 windows-x86_64 darwin-aarch64 darwin-x86_64; do
              if [ -d "$cell/$key" ]; then
                mkdir -p "manifest-src/$key"
                cp -a "$cell/$key/." "manifest-src/$key/"
              fi
            done
          done
          PUBLIC_BASE="https://downloads.yetu.fbcsoftwares.com/pos/${VERSION}"
          scripts/build-updater-manifest.sh "$VERSION" "$PUBLIC_BASE" manifest-src > stage/latest.json
          (
            cd stage
            find . -type f ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.asc' \
              | sed 's|^\./||' | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum -- "$file"; done > SHA256SUMS
          )

      - name: SSH publish to peak-prod downloads
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ] || [ -z "${PRODUCTION_HOST:-}" ] || [ -z "${PRODUCTION_USER:-}" ]; then
            echo "::error::production SSH secrets are missing"
            exit 1
          fi
          PRODUCTION_HOST=$(printf '%s' "$PRODUCTION_HOST" | tr -d '\r\n[:space:]')
          PRODUCTION_USER=$(printf '%s' "$PRODUCTION_USER" | tr -d '\r\n[:space:]')
          python3 scripts/ci-write-ssh-key.py
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          REMOTE_STAGE="/tmp/yetu-pos-release-stage-${VERSION}-$$"
          ssh -o IdentitiesOnly=yes -o BatchMode=yes \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          # tar|ssh is more reliable than scp -r with many large binaries.
          tar -C stage -cf - . | ssh -o IdentitiesOnly=yes -o BatchMode=yes \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "tar -C '$REMOTE_STAGE' -xf -"
          ssh -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "PEAK_POS_VERSION=$VERSION PEAK_POS_STAGE_DIR=$REMOTE_STAGE sh -s" \
            < scripts/publish-downloads.sh
          ssh -o IdentitiesOnly=yes -o BatchMode=yes \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "rm -rf '$REMOTE_STAGE'"

      - name: Smoke HTTPS downloads + updater manifest
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          BASE=https://downloads.yetu.fbcsoftwares.com/pos
          curl -fsSL "$BASE/stable/latest.json" | tee /tmp/latest.json
          python3 - <<PY
          import json, os, urllib.request
          version = os.environ["VERSION"]
          data = json.load(open("/tmp/latest.json"))
          assert data["version"] == version, data["version"]
          for key, entry in data["platforms"].items():
              url = entry["url"]
              print("HEAD", key, url)
              req = urllib.request.Request(url, method="HEAD")
              with urllib.request.urlopen(req, timeout=60) as resp:
                  assert resp.status == 200, (url, resp.status)
          print("smoke ok")
          PY
          curl -fsSIL "$BASE/latest/SHA256SUMS" | head -5
