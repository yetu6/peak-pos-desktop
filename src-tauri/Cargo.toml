[package]
name = "peak-pos-desktop"
version = "0.1.6"
description = "Peak POS desktop shell"
authors = ["Peak"]
edition = "2021"

[lib]
name = "peak_pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
futures-util = "0.3"
http = "1"
tokio = { version = "1", features = ["macros", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "=0.4.3"
base64 = "=0.23.1"
sha2 = "=0.11.0"
zeroize = { version = "=1.9.0", features = ["derive"] }
thiserror = "=2.0.20"
ed25519-dalek = { version = "=3.0.0", features = ["alloc", "pkcs8"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
subtle = "=2.6.1"
time = { version = "=0.3.55", features = ["parsing"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "rustls"] }
tauri-plugin-updater = "2.12.0"
# Pinned: 2.5.1 is the newest that runs on our Tauri 2.11 without moving it (2.7 pulls
# Tauri 2.12, wry and 39 others). Start-with-the-computer (src/start_with_computer.rs).
tauri-plugin-autostart = "=2.5.1"

[dev-dependencies]
tempfile = "=3.27.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
